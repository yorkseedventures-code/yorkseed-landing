# Yorkseed site on Netlify.
# Each deploy rebuilds The Yorkseed List pages from list/data/master.json + list/events.json.
# The "|| echo" means a failed rebuild never blocks a deploy: the last built pages stay live.
[build]
  # Publish only the weekly rebuild or a commit marked [deploy]; every other push is skipped (no credits used)
  ignore = "git log -1 --pretty=%B | grep -qF '[deploy]' && exit 1 || exit 0"
  publish = "."
  command = "python3 scripts/build_list_pages.py || echo 'List rebuild skipped'"

[build.environment]
  PYTHON_VERSION = "3.11"

[images]
  # The List's build script (scripts/build_list_pages.py) proxies every non-yorkseed.co event cover photo
  # through /.netlify/images for the og:image tag, specifically because WhatsApp/iMessage reject many
  # hotlinked CDN images (webp/avif, odd sizes) unless they're re-served as a plain 1200x630 JPEG.
  # Event cover photos are scraped from whatever host each organizer happens to host their event page on
  # -- currently 170+ distinct hosts and growing with every new event -- so an enumerated allowlist here
  # silently breaks the share-preview image for any host not yet added (confirmed: only 7 of 170+ actual
  # source hosts were listed, leaving most events with a broken social-preview image). A single permissive
  # pattern covers any https source instead of needing a manual update every time a new host shows up.
  remote_images = ["https://.*"]
