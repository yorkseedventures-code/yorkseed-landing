<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our people &middot; Yorkseed</title>
<meta name="description" content="Meet the Yorkseed team, hub directors and volunteers around the world.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://yorkseed.co/team/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Yorkseed">
<meta property="og:title" content="Our people &middot; Yorkseed">
<meta property="og:description" content="Meet the Yorkseed team, hub directors and volunteers around the world.">
<meta property="og:url" content="https://yorkseed.co/team/">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Source+Serif+4:wght@400;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/team/team.css">
<script src="/assets/ys-ref.js" defer></script>
</head>
<body>
<div class="wrap dir">
  <a class="brand" href="https://yorkseed.co"><img src="/assets/brand/yorkseed-logo.png" alt="Yorkseed"></a>
  <div class="eyebrow">Yorkseed</div>
  <h1>Our people</h1>
  <p class="lede">The team, hub directors and volunteers who run Yorkseed around the world. Tap a name for their page and links.</p>

  <div id="groups"></div>
  <p id="empty" class="lede" hidden>No one is listed here yet.</p>

  <div class="foot"><a href="https://yorkseed.co">yorkseed.co</a></div>
</div>

<script>
(function () {
  var API = "https://yorkseed-backend-production.up.railway.app";
  var ORDER = ["Team", "Hub Director", "Volunteer"];
  var LABELS = { "Team": "Team", "Hub Director": "Hub Directors", "Volunteer": "Volunteers" };
  var CLASS = { "Team": "cat-team", "Hub Director": "cat-hub", "Volunteer": "cat-volunteer" };

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function row(m) {
    var a = document.createElement("a");
    a.className = "row";
    a.href = "/team/" + m.slug;
    var meta = [m.role, m.city].filter(Boolean).join(", ");
    a.innerHTML =
      '<div><div class="name">' + escapeHtml(m.name) + '</div>' +
      (meta ? '<div class="meta">' + escapeHtml(meta) + '</div>' : '') +
      '</div><div class="go">View &rarr;</div>';
    return a;
  }

  fetch(API + "/api/team")
    .then(function (r) { return r.json(); })
    .then(function (data) {
      // Unassigned general cards (/team/a to /team/h, /team/volunteer,
      // /team/yorkseed) all read "Yorkseed Team": they are not people, so
      // they stay out of the directory until a card is given to someone.
      var members = ((data && data.members) || data || []).filter(function (m) { return m.name !== "Yorkseed Team"; });
      if (!Array.isArray(members) || members.length === 0) {
        document.getElementById("empty").hidden = false;
        return;
      }
      var byCat = {};
      members.forEach(function (m) {
        var cat = m.category || "Team";
        (byCat[cat] = byCat[cat] || []).push(m);
      });
      var groupsEl = document.getElementById("groups");
      ORDER.forEach(function (cat) {
        var list = byCat[cat];
        if (!list || !list.length) return;
        var section = document.createElement("div");
        section.className = "group " + CLASS[cat];
        var h2 = document.createElement("div");
        h2.className = "sec";
        h2.textContent = LABELS[cat];
        section.appendChild(h2);
        list.forEach(function (m) { section.appendChild(row(m)); });
        groupsEl.appendChild(section);
      });
    })
    .catch(function () {
      document.getElementById("empty").textContent = "Could not load the team right now. Please try again shortly.";
      document.getElementById("empty").hidden = false;
    });
})();
</script>
</body>
</html>
