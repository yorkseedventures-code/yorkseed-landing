<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title id="pagetitle">Yorkseed</title>
<meta id="metadesc" name="description" content="Meet the Yorkseed team.">
<meta name="robots" content="index, follow">
<link id="canon" rel="canonical" href="https://yorkseed.co/team/">
<meta property="og:type" content="profile">
<meta property="og:site_name" content="Yorkseed">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Source+Serif+4:wght@400;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/team/team.css">
<script src="/assets/ys-ref.js" defer></script>
</head>
<body>
<div class="wrap">
  <a class="brand" href="https://yorkseed.co"><img src="/assets/brand/yorkseed-logo.png" alt="Yorkseed"></a>

  <div id="profile" hidden>
    <img id="photo" class="photo" src="" alt="" hidden>
    <div id="ph" class="ph" hidden></div>

    <div id="badge" class="badge"></div>
    <h1 id="name"></h1>
    <div id="role" class="role" hidden></div>
    <p id="bio" class="bio" hidden></p>

    <div id="links" class="links"></div>

    <div class="sec">More from Yorkseed</div>
    <div id="stdlinks" class="links"></div>

    <div class="foot" id="footline"></div>
    <div class="teamlogin"><a href="https://yorkseed.co/event-admin.html#team">Is this your page? Log in to edit it</a></div>
  </div>

  <div id="notfound" class="notfound" hidden>
    <h1>We couldn't find that page</h1>
    <p>This profile may have moved. <a href="/team/">See the full team directory</a>.</p>
  </div>
</div>

<script>
(function () {
  var API = "https://yorkseed-backend-production.up.railway.app";
  var LABELS = { "Team": "Team", "Hub Director": "Hub Director", "Volunteer": "Volunteer" };

  var STANDARD_LINKS = [
    { label: "Yorkseed Delegations, join a founder or investor trip to a major event", url: "https://yorkseed.co/delegation/" },
    { label: "30 days free on Yorkseed Connect", url: "https://app.yorkseed.co/eventoffer" },
    { label: "Host an event with Yorkseed", url: "https://yorkseed.co/host-with-yorkseed.html" },
    { label: "Request a Yorkseed event partnership", url: "https://yorkseed.co/event-partner-request" },
    { label: "Get monthly deal flow from our Core members", url: "https://tally.so/r/vGX1YA" },
    { label: "KoiCard, free scan-and-save business cards", url: "https://koicard.app/landing" }
  ];

  function escapeHtml(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function initials(name) {
    return (name || "").trim().split(/\s+/).map(function (p) { return p[0]; }).slice(0, 2).join("").toUpperCase();
  }

  function linkRow(label, url, sub) {
    var a = document.createElement("a");
    a.className = sub ? "lnk sub" : "lnk";
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
    a.innerHTML = "<span>" + escapeHtml(label) + " ↗</span>";
    return a;
  }

  var slug = new URLSearchParams(window.location.search).get("u") ||
    window.location.pathname.replace(/^\/team\//, "").replace(/\/$/, "");

  var stdEl = document.getElementById("stdlinks");
  STANDARD_LINKS.forEach(function (l) { stdEl.appendChild(linkRow(l.label, l.url, true)); });

  if (!slug) {
    document.getElementById("notfound").hidden = false;
  } else {
    fetch(API + "/api/team/" + encodeURIComponent(slug))
      .then(function (r) { if (!r.ok) throw new Error("not found"); return r.json(); })
      .then(function (data) {
        var m = (data && data.member) || data;
        if (!m || !m.name) throw new Error("not found");

        document.getElementById("pagetitle").textContent = m.name + (m.role ? ", " + m.role : "") + " · Yorkseed";
        document.getElementById("metadesc").setAttribute("content", m.name + (m.role ? " (" + m.role + ")" : "") + " at Yorkseed.");
        document.getElementById("canon").setAttribute("href", "https://yorkseed.co/team/" + slug);

        var cat = m.category || "Team";
        var badgeText = [LABELS[cat] || cat, m.city].filter(Boolean).join(" · ");
        document.getElementById("badge").textContent = badgeText;

        document.getElementById("name").textContent = m.name;

        if (m.role) {
          document.getElementById("role").textContent = m.role;
          document.getElementById("role").hidden = false;
        }
        if (m.bio) {
          document.getElementById("bio").textContent = m.bio;
          document.getElementById("bio").hidden = false;
        }

        if (m.hasPhoto) {
          var img = document.getElementById("photo");
          img.src = API + "/api/team/" + slug + "/photo";
          img.alt = m.name;
          img.hidden = false;
        } else {
          var ph = document.getElementById("ph");
          ph.textContent = initials(m.name);
          ph.hidden = false;
        }

        var linksEl = document.getElementById("links");
        (m.links || []).forEach(function (l) { linksEl.appendChild(linkRow(l.label, l.url, false)); });

        document.getElementById("footline").innerHTML = "A Yorkseed " + escapeHtml(LABELS[cat] || cat) + " · <a href=\"https://yorkseed.co\">yorkseed.co</a>";

        document.getElementById("profile").hidden = false;
      })
      .catch(function () {
        document.getElementById("notfound").hidden = false;
      });
  }
})();
</script>
</body>
</html>
