<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Event | Yorkseed</title>
<meta name="description" content="Yorkseed event details."/>
<link rel="canonical" href="https://yorkseed.co/events.html"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#111;--ink2:#1a1a1a;--ink3:#555;--ink4:#888;
  --white:#fff;--off:#fafafa;--light:#f5f4f1;--mid:#e8e8e8;
  --red:#c8372d;--red-dim:rgba(200,55,45,.06);--red-border:rgba(200,55,45,.18);
  --gold:#b08d57;--gold-dim:rgba(176,141,87,.07);--gold-border:rgba(176,141,87,.22);
  --border:rgba(0,0,0,.07);--border2:rgba(0,0,0,.12);
  --serif:'Playfair Display',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',monospace;
}
body{font-family:var(--sans);font-weight:300;background:var(--white);color:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{text-decoration:none;color:inherit}
nav{position:fixed;top:0;left:0;right:0;z-index:500;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 5vw;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.n-logo{display:flex;align-items:center;flex-shrink:0}
.n-center{display:flex;align-items:center;gap:4px;flex:1;justify-content:center}
.n-link{font-size:12.5px;font-weight:400;color:var(--ink3);padding:6px 10px;border-radius:5px;transition:color .15s,background .15s;white-space:nowrap;letter-spacing:.01em}
.n-link:hover{color:var(--ink);background:rgba(0,0,0,.04)}
.n-link.active{color:var(--ink);font-weight:500}
.n-drop{position:relative}
.n-drop-btn{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:400;color:var(--ink3);padding:6px 10px;border-radius:5px;cursor:pointer;transition:color .15s,background .15s;letter-spacing:.01em;background:none;border:none;font-family:inherit}
.n-drop-btn:hover,.n-drop.open .n-drop-btn{color:var(--ink);background:rgba(0,0,0,.04)}
.n-drop-arrow{width:10px;height:10px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.n-drop.open .n-drop-arrow{transform:rotate(180deg)}
.n-menu{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);background:#fff;border:1px solid var(--border2);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.1);padding:10px;width:540px;display:grid;grid-template-columns:1fr 1fr;gap:2px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s,transform .18s;transform:translateX(-50%) translateY(-6px)}
.n-drop.open .n-menu{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.n-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;transition:background .15s;text-decoration:none;color:var(--ink)}
.n-item:hover{background:var(--off)}
.n-item-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.n-item-title{font-size:12.5px;font-weight:500;color:var(--ink);margin-bottom:2px}
.n-item-desc{font-size:11px;color:var(--ink4);line-height:1.5;font-weight:300}
.n-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.n-signin{font-size:12.5px;color:var(--ink4);padding:6px 10px;border-radius:5px;transition:color .15s;white-space:nowrap;letter-spacing:.01em}
.n-signin:hover{color:var(--ink)}
.n-apply{background:var(--red);color:#fff;padding:8px 18px;border-radius:6px;font-size:12.5px;font-weight:400;letter-spacing:.02em;transition:opacity .15s;white-space:nowrap}
.n-apply:hover{opacity:.88}
.n-ham{display:none;flex-direction:column;justify-content:center;gap:5px;width:44px;height:44px;padding:10px;cursor:pointer;background:none;border:none;border-radius:5px;flex-shrink:0}
.n-ham span{display:block;height:1.5px;background:var(--ink);border-radius:2px;transition:transform .25s,opacity .25s}
.n-ham.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.n-ham.open span:nth-child(2){opacity:0;transform:scaleX(0)}
.n-ham.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
.n-drawer{position:fixed;inset:64px 0 0 0;background:#fff;z-index:200;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;padding:20px 6vw 40px}
.n-drawer.open{transform:translateX(0)}
.n-drawer-section{margin-bottom:28px}
.n-drawer-label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink4);margin-bottom:10px}
.n-drawer-link{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);color:var(--ink);font-size:14px;font-weight:400;text-decoration:none}
.n-drawer-link:last-child{border-bottom:none}
.n-drawer-link span:first-child{font-size:20px;flex-shrink:0;width:28px}
.n-drawer-ctas{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.n-drawer-ctas .n-apply{text-align:center;display:block;padding:13px}
.n-drawer-ctas .n-signin{text-align:center;display:block;padding:12px;border:1px solid var(--border2);border-radius:6px;color:var(--ink3)}
@media(max-width:900px){.n-center{display:none}.n-right .n-signin{display:none}.n-ham{display:flex}}
@media(max-width:500px){.n-right .n-apply{display:none}}

.event-hero{padding-top:64px;position:relative;overflow:hidden;min-height:460px;display:flex;align-items:center;background:#0d1215}
.event-hero-bg{position:absolute;inset:0;overflow:hidden}
.event-hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.4;display:block}
.event-hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,18,21,.3) 0%,rgba(13,18,21,.88) 100%)}
.event-hero-inner{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:52px 6vw;width:100%}
.event-breadcrumb{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:20px;display:flex;align-items:center;gap:8px}
.event-breadcrumb a{color:rgba(255,255,255,.45);transition:color .15s}
.event-breadcrumb a:hover{color:rgba(255,255,255,.8)}
.event-badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:3px;background:rgba(200,55,45,.85);color:#fff;margin-bottom:16px}
.event-badge::before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.event-hero h1{font-family:var(--serif);font-size:clamp(28px,4.5vw,54px);font-weight:400;color:#fff;line-height:1.1;letter-spacing:-.02em;margin-bottom:20px;max-width:700px}
.event-hero h1 em{font-style:italic;color:rgba(176,141,87,.9)}
.event-meta-strip{display:flex;gap:24px;flex-wrap:wrap}
.event-meta-item{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.7)}

.event-body{max-width:1100px;margin:0 auto;padding:52px 6vw;display:grid;grid-template-columns:1fr 340px;gap:48px;align-items:start}
@media(max-width:840px){.event-body{grid-template-columns:1fr;padding:32px 6vw}}

.event-section{margin-bottom:40px}
.event-section-label{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin-bottom:18px;display:flex;align-items:center;gap:10px}
.event-section-label::before{content:'';display:block;width:16px;height:1px;background:var(--red);opacity:.5}
.event-desc{font-size:15px;color:var(--ink3);line-height:1.85;font-weight:300}
.event-desc p{margin-bottom:16px}
.event-desc p:last-child{margin-bottom:0}
.event-desc strong{font-weight:500;color:var(--ink)}

.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-card{padding:14px 16px;border:1px solid var(--red-border);background:var(--red-dim);border-radius:8px;font-size:13px;color:var(--ink3);line-height:1.5;display:flex;align-items:flex-start;gap:10px}
.who-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:5px;background:#1a8a5a}

.expect-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.expect-item{padding:16px;background:var(--off);border:1px solid var(--border);border-radius:8px;display:flex;gap:12px;align-items:flex-start}
.expect-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.expect-text{font-size:13px;color:var(--ink3);line-height:1.6}
.expect-text strong{display:block;font-weight:500;color:var(--ink);margin-bottom:2px}

.speaker-card{padding:24px;border:1px solid var(--border);border-radius:10px;background:var(--off);display:flex;gap:20px;align-items:flex-start;margin-bottom:14px}
.speaker-name{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:3px}
.speaker-role{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--red);margin-bottom:10px}
.speaker-bio{font-size:12.5px;color:var(--ink4);line-height:1.7;font-weight:300}

.hosts-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.host-card{padding:20px;border:1px solid var(--border);border-radius:10px;background:var(--off)}
.host-name{font-size:14px;font-weight:500;color:var(--ink);margin-bottom:6px}
.host-desc{font-size:12.5px;color:var(--ink4);line-height:1.65;font-weight:300}

.event-sidebar{position:sticky;top:84px}
.sidebar-card{border:1px solid var(--border2);border-radius:12px;overflow:hidden;background:var(--white)}
.sidebar-top{padding:24px;border-bottom:1px solid var(--border)}
.sidebar-title{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ink);margin-bottom:16px;line-height:1.3}
.sidebar-meta{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.sidebar-meta-row{display:flex;gap:10px;align-items:flex-start}
.sidebar-meta-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.sidebar-meta-label{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);display:block;margin-bottom:2px}
.sidebar-meta-val{font-size:13px;color:var(--ink);font-weight:400}
.sidebar-spots{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--red-dim);border:1px solid var(--red-border);border-radius:6px;margin-bottom:16px}
.sidebar-spots-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;animation:pulse 2s infinite}
.sidebar-spots-text{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--red)}
.btn-rsvp{display:block;width:100%;background:var(--red);color:#fff;padding:14px 22px;border-radius:7px;font-size:13px;font-weight:400;letter-spacing:.02em;text-align:center;transition:opacity .15s;cursor:pointer;border:none;font-family:var(--sans);text-decoration:none}
.btn-rsvp:hover{opacity:.88}
.btn-rsvp-sub{font-size:11px;color:var(--ink4);text-align:center;margin-top:10px}
.sidebar-bottom{padding:18px 24px;background:var(--off);border-top:1px solid var(--border)}
.sidebar-bottom-label{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin-bottom:10px}
.tag-row{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:8px;letter-spacing:.06em;padding:3px 8px;border-radius:3px;background:rgba(0,0,0,.05);color:var(--ink3)}

@media(max-width:500px){.who-grid,.expect-grid,.hosts-grid{grid-template-columns:1fr}}

/* ── FOOTER MOBILE ── */
@media(max-width:600px){
  footer{padding:24px 5vw 20px!important}
  footer .footer-quick-links{
    display:grid!important;
    grid-template-columns:1fr 1fr!important;
    gap:8px!important;
    margin-bottom:16px!important;
    padding-bottom:16px!important;
    width:100%!important;
    box-sizing:border-box!important;
  }
  footer .footer-quick-links span:first-child{
    grid-column:1/-1!important;
    text-align:center!important;
  }
  footer .footer-quick-links a{
    font-size:12px!important;
    padding:10px 12px!important;
    min-height:44px!important;
    display:flex!important;
    align-items:center!important;
    justify-content:center!important;
    text-align:center!important;
    background:rgba(255,255,255,.05)!important;
    border-radius:6px!important;
    border:1px solid rgba(255,255,255,.08)!important;
    font-weight:500!important;
    color:rgba(255,255,255,.7)!important;
    box-sizing:border-box!important;
  }
  footer .footer-nav-links{
    gap:6px 8px!important;
    font-size:10px!important;
  }
  footer .footer-nav-links a{
    font-size:10px!important;
  }
}

.ev-msg{max-width:640px;margin:0 auto;padding:140px 6vw 120px;text-align:center;color:var(--ink3);font-size:16px;line-height:1.7}
.ev-msg a{color:var(--red)}
@media(max-width:840px){.event-hero{min-height:360px}.event-meta-strip{gap:12px;flex-direction:column}.event-hero-inner{padding:36px 6vw}}
</style>
<script src="/assets/site-chrome.js" defer></script>
<style>yk-header:not(:defined){display:block;min-height:73px}</style>
</head>
<body>
<yk-header><a href="/">Yorkseed</a> <a href="/hubs.html">Hubs</a> <a href="/events.html">Events</a> <a href="/investors">Investor list</a> <a href="/contact.html">Contact</a></yk-header>
<div id="app"><div class="ev-msg">Loading event...</div></div>
<yk-footer><a href="/">Home</a> <a href="/hubs.html">Hubs</a> <a href="/events.html">Events</a> <a href="/about.html">About</a> <a href="/contact.html">Contact</a></yk-footer>
<script>
var API='https://yorkseed-backend-production.up.railway.app/api/site-events/public/';
function clean(s){return String(s||'').replace(/&amp;/g,'&').replace(/\s[\u2014\u2013]\s/g,': ').replace(/[\u2014\u2013]/g,'-')}
function esc(s){return clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
var LABEL={passport:'Passport Series',expert:'Expert Session',summit:'Summit',house:'Yorkseed House',community:'Partner Event'};
function paras(t){var out='',list=[];function flush(){if(list.length){out+='<ul style="margin:0 0 16px 20px">'+list.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';list=[]}}
String(t||'').split(/\n+/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(x){if(x.indexOf('\u2022 ')===0){list.push(x.slice(2))}else{flush();out+='<p>'+esc(x)+'</p>'}});flush();return out}
function notFound(){document.getElementById('app').innerHTML='<div class="ev-msg">This event is not available. <a href="/events.html">See all events</a></div>'}
function slugOf(e){if(e.slug)return e.slug;var t=String(e.title||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' and ').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,70).replace(/-+$/,'');return t+'-'+String(e.dateISO||'').slice(0,7)}
var qs=new URLSearchParams(location.search),pm=location.pathname.match(/^\/e\/([^\/]+)/),id=qs.get('id'),sk=(pm&&decodeURIComponent(pm[1]))||qs.get('s');
function render(e){
  var loc=e.location||e.city||'',kind=e.series==='valois'||e.valois?'Valois':e.series==='nycfw'||e.nycfw?'NYC Founder Week':(LABEL[e.type]||'Event');
  document.title=clean(e.title)+' | Yorkseed';
  var md=document.querySelector('meta[name=description]');md.content=clean((e.description||'Yorkseed event').slice(0,150));
  var cover=e.coverImage?'<div class="event-hero-bg"><img src="'+esc(e.coverImage)+'" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'"/></div>':'';
  var rsvp=e.lumaUrl?'<a href="'+esc(e.lumaUrl)+'" target="_blank" rel="noopener" class="btn-rsvp">RSVP / Apply &rarr;</a><div class="btn-rsvp-sub">Opens the event page to RSVP</div>':'';
  var hosts=(e.hosts&&e.hosts.length)?'<div class="event-section"><div class="event-section-label">Hosted By</div><div class="hosts-grid">'+e.hosts.map(function(h){return '<div class="host-card"><div class="host-name">'+esc(h)+'</div></div>'}).join('')+'</div></div>':'';
  var meta='<div class="event-meta-item">'+esc(e.date)+'</div>'+(loc?'<div class="event-meta-item">'+esc(loc)+'</div>':'')+(e.spots?'<div class="event-meta-item">'+esc(e.spots)+'</div>':'');
  var side='<div class="sidebar-meta"><div class="sidebar-meta-row"><div><span class="sidebar-meta-label">Date &amp; Time</span><span class="sidebar-meta-val">'+esc(e.date)+'</span></div></div>'+(loc?'<div class="sidebar-meta-row"><div><span class="sidebar-meta-label">Location</span><span class="sidebar-meta-val">'+esc(loc)+'</span></div></div>':'')+(e.spots?'<div class="sidebar-meta-row"><div><span class="sidebar-meta-label">Entry</span><span class="sidebar-meta-val">'+esc(e.spots)+'</span></div></div>':'')+'</div>';
  var promo=e.promoCode?'<div class="sidebar-spots"><div class="sidebar-spots-text">Promo code: '+esc(e.promoCode)+'</div></div>':'';
  var tags=[e.city,kind].filter(Boolean).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('');
  document.getElementById('app').innerHTML=
   '<div class="event-hero">'+cover+'<div class="event-hero-overlay"></div><div class="event-hero-inner"><div class="event-breadcrumb"><a href="/events.html">Events</a><span>&rsaquo;</span><span>'+esc(kind)+'</span></div><div class="event-badge">'+esc(kind)+(e.city?' &middot; '+esc(e.city):'')+'</div><h1>'+esc(e.title)+'</h1><div class="event-meta-strip">'+meta+'</div></div></div>'+
   '<div class="event-body"><div><div class="event-section"><div class="event-section-label">About This Event</div><div class="event-desc">'+(paras(e.description)||'<p>Details coming soon.</p>')+'</div></div>'+hosts+'</div>'+
   '<div class="event-sidebar"><div class="sidebar-card"><div class="sidebar-top"><div class="sidebar-title">'+esc(e.title)+'</div>'+side+promo+rsvp+'</div><div class="sidebar-bottom"><div class="sidebar-bottom-label">Tags</div><div class="tag-row">'+tags+'</div></div></div></div></div>';
}
function lumaOf(e){var u=e.lumaUrl||e.url||'';return /(lu\.ma|luma\.com)/.test(u)?u:(e.lumaUrl||'')}
if(sk){
fetch('/events.json').then(function(r){return r.json()}).then(function(j){
  var all=(j.upcoming||[]).concat((j.archive||[]).reduce(function(a,g){return a.concat(g.events||[])},[]));
  var e=null;all.forEach(function(x){if(!e&&slugOf(x)===sk)e=x});
  if(!e){return fetch(API+encodeURIComponent(sk)).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){render(d.event)})}
  e=Object.assign({},e);e.lumaUrl=lumaOf(e);e.coverImage=(e.coverImage||'').replace(/^\/(https?:\/\/)/,'$1');
  render(e);
}).catch(notFound)
}else if(!id||!/^[a-f0-9]{24}$/i.test(id)){notFound()}else{
fetch(API+id).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){render(d.event)}).catch(notFound)}
</script>
</body>
</html>
