# TEMPORARY: quick import of conference Luma calendars (held branch). Delete before merging.
name: List quick conference calendars (branch only)
on:
  push:
    branches: [list-seo-nyc]
    paths: [".github/workflows/list-jpm-quick.yml"]
permissions:
  contents: write
jobs:
  cal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -u scripts/import_calendar.py cal-7gz3T0CJVUV1bsi:sf cal-HXtc5Zou7cHo2Vy:sf
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "yorkseed-list-bot"; git config user.email "actions@users.noreply.github.com"
          git add list/data/calendar-import.json; git commit -m "Quick import: JPM Healthcare Week calendars" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin list-seo-nyc && git push && exit 0; git rebase --abort 2>/dev/null; sleep 7; done; exit 1
