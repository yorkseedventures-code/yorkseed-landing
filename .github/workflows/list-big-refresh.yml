# One-off deep refresh of The Yorkseed List, run only on the list-big-refresh branch.
# Imports from every source (FounderCal, Luma, Meetup, techmeetups, confs.tech, iCal feeds...) out to the end of June 2027,
# rebuilds the pages and commits the result back to this branch. It never touches main, and its commits carry no
# [deploy] tag, so Netlify skips them (see netlify.toml "ignore"). Delete this file before merging the branch.
name: List big refresh (branch only, no deploy)
on:
  push:
    branches: [list-big-refresh]
    paths: [".github/workflows/list-big-refresh.yml"]
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: list-big-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: list-big-refresh }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Import events from all sources through June 2027
        env:
          YS_HORIZON_DAYS: "218"
        run: python3 scripts/list_enrich.py 2>&1 | tee import-log.txt || echo "enrich step had errors"
      - name: Rebuild city and conference pages
        run: python3 scripts/build_list_pages.py
      - uses: actions/upload-artifact@v4
        with: { name: import-log, path: import-log.txt }
      - name: Commit to this branch only (no deploy tag)
        run: |
          git config user.name "yorkseed-list-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A list sitemap.xml _redirects *-startup-communities.html
          git commit -m "The List: deep refresh through June 2027 (branch only, not deployed)" || echo "nothing new"
          for i in 1 2 3; do git pull --rebase -X theirs -q origin list-big-refresh && git push origin HEAD:list-big-refresh && break; sleep 5; done
