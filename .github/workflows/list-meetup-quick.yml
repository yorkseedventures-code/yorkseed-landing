# TEMPORARY: quick Meetup import of newly added groups (held branch). Delete before merging.
name: List quick meetup import (branch only)
on:
  push:
    branches: [list-seo-nyc]
    paths: ["list/data/meetup-new.txt", ".github/workflows/list-meetup-quick.yml"]
permissions:
  contents: write
jobs:
  meetup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -u scripts/import_meetup_quick.py --file list/data/meetup-new.txt
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "yorkseed-list-bot"; git config user.email "actions@users.noreply.github.com"
          git add list/data/meetup-import.json; git commit -m "Quick import: new Meetup groups" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin list-seo-nyc && git push && exit 0; git rebase --abort 2>/dev/null; sleep 7; done; exit 1
