# Weekly report-only check of upcoming event links on The Yorkseed List. Never edits events or deploys.
name: Check List event links
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 scripts/check_list_links.py
      - run: cat link-report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: link-report, path: link-report.md }
