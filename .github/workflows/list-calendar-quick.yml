# TEMPORARY: quick import of one Luma calendar on the held branch (runs alongside the long import). Delete before merging.
name: List quick calendar import (branch only)
on:
  push:
    branches: [list-seo-nyc]
    paths: ["scripts/import_calendar.py", "scripts/import_geo.py", ".github/workflows/list-calendar-quick.yml"]
permissions:
  contents: write
jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -u scripts/import_geo.py
      - run: |
          git config user.name "yorkseed-list-bot"; git config user.email "actions@users.noreply.github.com"
          git add list/data/geo-import.json; git commit -m "Quick import: Luma by coordinates" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin list-seo-nyc && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done; exit 1
