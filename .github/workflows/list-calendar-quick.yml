# TEMPORARY: quick imports on the held branch, each saving to its own file. Delete before merging.
name: List quick calendar import (branch only)
on:
  push:
    branches: [list-seo-nyc]
    paths: ["scripts/import_calendar.py", "scripts/import_geo.py", "scripts/harvest_calendars.py", "scripts/import_meetup_quick.py", "scripts/import_ical_quick.py", ".github/workflows/list-calendar-quick.yml"]
permissions:
  contents: write
jobs:
  meetup:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 -u scripts/import_ical_quick.py
        continue-on-error: true
      - if: always()
        run: |
          git config user.name "yorkseed-list-bot"; git config user.email "actions@users.noreply.github.com"
          git checkout -- list/events.json; git add list/data/ical-import.json; git commit -m "Quick import: iCal feeds" || exit 0
          for i in 1 2 3 4 5 6; do git pull --rebase -q origin list-seo-nyc && git push && exit 0; git rebase --abort 2>/dev/null; sleep 7; done; exit 1
