# TEMPORARY: fetch a page from GitHub's network to see how it loads its events. Delete before merging.
name: List probe (branch only)
on:
  push:
    branches: [list-seo-nyc]
    paths: [".github/workflows/list-probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p list/data/probe; cd list/data/probe
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sSL -A "$UA" -D slush-headers.txt "https://platform.slush.org/public/slush26/activities/browse" -o slush.html || true
          wc -c slush.html > slush-size.txt || true
          grep -oE '(https?:)?//[a-zA-Z0-9./_-]*(api|graphql)[a-zA-Z0-9./_?=&-]*|/_next/static/[a-zA-Z0-9./_-]+\.js|"/api/[^"]+"' slush.html | sort -u > slush-urls.txt || true
          curl -sSL -A "$UA" "https://platform.slush.org/assets/index-CeYaD5T9.js" -o app.js || true
          wc -c app.js >> slush-size.txt
          grep -oE '.{0,120}activit.{0,160}' app.js | head -60 > slush-js-activities.txt || true
          grep -oE 'https?://[a-zA-Z0-9.-]+(/[a-zA-Z0-9_./-]*)?' app.js | grep -iE 'api|slush|brella|graph' | sort -u | head -40 > slush-js-urls.txt || true
          for f in $(grep -oE '"(\./)?[A-Za-z0-9_@-]+-[A-Za-z0-9_-]{8}\.js"' app.js | tr -d '"' | sed 's#^\./##' | sort -u | grep -iE 'activ|browse|event|program|public' | head -10); do
            curl -sSL -A "$UA" "https://platform.slush.org/assets/$f" | grep -oE '.{0,120}(api|activit).{0,160}' | head -40 >> slush-js-activities.txt || true
          done
          rm -f app.js
          head -c 300000 slush.html > slush.html.tmp && mv slush.html.tmp slush.html
      - run: |
          git config user.name "yorkseed-list-bot"; git config user.email "actions@users.noreply.github.com"
          git add list/data/probe; git commit -m "Probe: Slush app bundle" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -q origin list-seo-nyc && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
