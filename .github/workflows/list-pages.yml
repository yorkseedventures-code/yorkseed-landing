# Rebuilds The Yorkseed List city and conference pages every morning (6:15 AM New York)
# and commits them, which makes Netlify publish the fresh pages automatically.
name: Rebuild The Yorkseed List pages
on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: list-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/build_list_pages.py
      - run: |
          git config user.name "yorkseed-list-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A list sitemap.xml *-startup-communities.html
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "The List: daily rebuild $(date -u +%Y-%m-%d)"
          git push
