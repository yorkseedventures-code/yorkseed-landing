# Rebuilds and publishes The Yorkseed List every day at 3:00 AM New York:
# 1. imports queued events and finds each event's real cover photo (scripts/list_enrich.py)
# 2. rebuilds the city and conference pages (scripts/build_list_pages.py)
# then commits, which makes Netlify publish the fresh pages automatically.
name: Rebuild The Yorkseed List pages
on:
  schedule:
    # every day, 3:00 AM New York. GitHub runs on UTC, so both slots are listed
    # (07:00 UTC in summer time, 08:00 UTC in winter) and the gate step below keeps only the 3 AM one.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: list-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Only run at 3 AM New York time
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(TZ=America/New_York date +%H)" = "03" ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "Not 3 AM in New York, skipping"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == '1'
        with:
          ref: main          # always start from the latest version, even if this run was queued
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with:
          python-version: "3.12"
      - name: Import queued events and find event photos
        if: steps.gate.outputs.go == '1'
        run: python3 scripts/list_enrich.py || echo "enrich step skipped"
      - name: Rebuild city and conference pages
        if: steps.gate.outputs.go == '1'
        run: python3 scripts/build_list_pages.py
      - if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "yorkseed-list-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A list sitemap.xml _redirects *-startup-communities.html
          # always commit: this weekly commit is what tells Netlify to publish (see netlify.toml "ignore")
          git commit --allow-empty -m "The List: daily rebuild $(date -u +%Y-%m-%d) [deploy]"
          # if someone pushed while this ran, keep their changes and this run's imported data
          for i in 1 2 3; do
            git pull --rebase -X theirs -q origin main || { git rebase --abort; git pull --no-rebase -X ours -q origin main; }
            git push && break; sleep 5
          done
      - name: Tell search engines about new pages (IndexNow)
        if: steps.gate.outputs.go == '1'
        run: sleep 90; python3 scripts/indexnow.py || true
